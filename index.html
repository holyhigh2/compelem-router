<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>compelem-router</title>
</head>

<body>
  <script>
    window.addEventListener('error', function (e) {
      var d = document.createElement('pre');
      d.style.cssText = 'position:fixed;top:0;left:0;z-index:99999;background:#fee;color:#c00;padding:10px;white-space:pre-wrap;max-width:100vw;max-height:50vh;overflow:auto';
      d.textContent = 'ERR: ' + ((e.error && (e.error.stack || e.error.message)) || e.message);
      document.body.appendChild(d);
    });
    window.addEventListener('unhandledrejection', function (e) {
      var d = document.createElement('pre');
      d.style.cssText = 'position:fixed;top:0;left:0;z-index:99998;background:#eef;color:#00c;padding:10px;white-space:pre-wrap;max-width:100vw';
      d.textContent = 'PROMISE: ' + ((e.reason && (e.reason.stack || e.reason.message)) || e.reason);
      document.body.appendChild(d);
    });
  </script>
  <script type="module" src="./test/index.ts"></script>

  <app-comp></app-comp>
</body>

</html>
